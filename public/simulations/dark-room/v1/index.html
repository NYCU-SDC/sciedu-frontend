<!doctype html>
<html lang="zh-Hant">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <meta
            name="description"
            content="黑暗箱中的玩偶：切換 LED 與隔板，觀察光從光源到玩偶、再到觀察者的路徑。"
        />
        <title>黑暗箱中的玩偶能被看見嗎？</title>
        <link rel="stylesheet" href="assets/lab.css?v=3" />
        <link rel="stylesheet" href="assets/topic01.css?v=3" />
        <link rel="stylesheet" href="embed.css" />
    </head>
    <body>
        <main class="shell">
            <header class="heading">
                <span class="chapter" id="number">01</span>
                <div>
                    <h1 id="title">黑暗箱中的玩偶能被看見嗎？</h1>
                    <p id="question"></p>
                </div>
            </header>
            <section class="scene-card">
                <div class="simulation-controls">
                    <div class="control-intro">
                        <p class="panel-caption">Simulation</p>
                        <p id="hint" class="hint"></p>
                    </div>
                    <div id="controls"></div>
                </div>
                <div id="viewport" class="viewport">
                    <svg
                        id="label-lines"
                        style="
                            position: absolute;
                            inset: 0;
                            width: 100%;
                            height: 100%;
                            pointer-events: none;
                        "
                        aria-hidden="true"
                    ></svg>
                    <div id="labels" class="labels" aria-hidden="true"></div>
                    <span class="view-tip">拖曳可旋轉 3D 場景</span>
                    <p id="error" class="error" role="alert" hidden></p>
                </div>
                <div class="scene-footer">
                    <p id="status" aria-live="polite"></p>
                    <small>暗箱剖視示意；光路線用來表示傳播方向。</small>
                </div>
            </section>
            <div hidden>
                <input type="checkbox" id="raysToggle" checked /><input
                    type="checkbox"
                    id="labelsToggle"
                    checked
                /><input type="checkbox" id="flowToggle" checked />
                <button type="button" id="reset">重新開始</button
                ><button type="button" id="zoomOut">縮小</button
                ><button type="button" id="zoomIn">放大</button>
                <div id="metrics"></div>
                <div id="model-details"></div>
            </div>
        </main>
        <script src="assets/three.min.js"></script>
        <script src="assets/Reflector.js"></script>
        <script src="assets/lab.js?v=4"></script>
        <script src="assets/topics_01_10.js?v=3"></script>

            OpticsLab.start(1);

        <script src="bridge.js"></script>
