name: Validate Course Materials

on:
    pull_request:
        paths:
            - "tools/course-materials/**"
            - "tools/argumentation/**"
            - "tools/ccm/**"
            - "public/simulations/**"
            - ".github/workflows/course-materials.yaml"
    push:
        branches:
            - main
        paths:
            - "tools/course-materials/**"
            - "tools/argumentation/**"
            - "tools/ccm/**"
            - "public/simulations/**"
            - ".github/workflows/course-materials.yaml"

permissions:
    contents: read

jobs:
    Materials:
        name: Validate course materials and extraction
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Validate manifests and assets
              run: python3 tools/course-materials/validate.py

            - name: Run extraction regression tests
              run: python3 -m unittest discover -s tools/course-materials -p 'test_*.py' -v

            - name: Run argumentation extraction regression tests
              run: python3 -m unittest discover -s tools/argumentation -p 'test_*.py' -v

            - name: Set up Node.js for upload safety tests
              uses: actions/setup-node@v6
              with:
                  node-version: 24

            - name: Run draft upload safety tests
              run: node --test tools/argumentation/test_*.mjs

            - name: Validate CCM materials and upload safety
              run: |
                  python3 tools/ccm/validate.py
                  python3 tools/ccm/build_upload.py
                  node --test tools/ccm/test_*.mjs
